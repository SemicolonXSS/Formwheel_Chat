<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FormWheel Chat</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f7f8fc;
  color:#202124;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e7e9ef;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  flex-shrink:0;
  z-index:10;
}

.logo{
  text-decoration:none;
  color:#202124;
  font-weight:800;
  font-size:22px;
  display:flex;
  align-items:center;
  gap:7px;
}

.logoWheel{
  width:28px;
  height:28px;
  border-radius:50%;
  border:4px solid #202124;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.userNameTop{
  font-size:14px;
  font-weight:700;
}

.logoutBtn,
.smallBtn{
  border:1px solid #dddfe6;
  background:#fff;
  border-radius:9px;
  padding:8px 12px;
}

.logoutBtn:hover,
.smallBtn:hover{
  background:#f3f4f7;
}

/* LOGIN */
.loginScreen{
  position:fixed;
  inset:0;
  background:#f7f8fc;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.loginCard{
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid #e5e7ed;
  border-radius:20px;
  padding:30px;
  box-shadow:0 15px 45px rgba(0,0,0,.07);
}

.loginLogo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin-bottom:8px;
}

.loginSub{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

.authTabs{
  display:flex;
  gap:6px;
  background:#f3f4f7;
  border-radius:10px;
  padding:4px;
  margin-bottom:18px;
}

.authTab{
  flex:1;
  border:0;
  background:transparent;
  border-radius:8px;
  padding:10px;
}

.authTab.active{
  background:#fff;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
  font-weight:700;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.field input{
  width:100%;
  padding:12px 13px;
  border:1px solid #dfe2e8;
  border-radius:10px;
  outline:none;
}

.field input:focus{
  border-color:#555;
}

.primaryBtn{
  width:100%;
  border:0;
  border-radius:11px;
  background:#202124;
  color:#fff;
  padding:13px;
  font-weight:700;
  margin-top:5px;
}

.primaryBtn:hover{
  opacity:.9;
}

.authError{
  min-height:20px;
  color:#e53935;
  font-size:13px;
  margin-top:10px;
  text-align:center;
}

/* MAIN */
.main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:280px minmax(0,1fr) 300px;
}

/* LEFT SIDEBAR */
.sidebar{
  background:#fff;
  border-right:1px solid #e7e9ef;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.sidebarTop{
  padding:16px;
  border-bottom:1px solid #eee;
}

.sidebarTitle{
  font-size:18px;
  font-weight:800;
  margin-bottom:12px;
}

.roomSearch{
  width:100%;
  padding:10px 11px;
  border:1px solid #dddfe6;
  border-radius:9px;
  outline:none;
}

.roomActions{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.roomActions button{
  flex:1;
  border:1px solid #dddfe6;
  background:#fff;
  border-radius:9px;
  padding:9px 5px;
  font-size:13px;
}

.roomActions button:hover{
  background:#f4f5f7;
}

.roomList{
  flex:1;
  overflow-y:auto;
  padding:8px;
}

.roomItem{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  border-radius:10px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:3px;
}

.roomItem:hover{
  background:#f3f4f7;
}

.roomItem.active{
  background:#eceef3;
}

.roomIcon{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#f0f1f5;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-size:18px;
}

.roomInfo{
  min-width:0;
  flex:1;
}

.roomName{
  font-weight:700;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roomPreview{
  color:#8a8d96;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:3px;
}

.roomMeta{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:4px;
}

.roomTime{
  color:#999;
  font-size:10px;
}

.unread{
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:10px;
  background:#202124;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:800;
}

.noRooms{
  text-align:center;
  color:#999;
  font-size:13px;
  padding:30px 15px;
}

/* CHAT */
.chat{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#f7f8fc;
}

.chatHeader{
  height:64px;
  flex-shrink:0;
  background:#fff;
  border-bottom:1px solid #e7e9ef;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.chatTitle{
  font-weight:800;
  font-size:16px;
}

.chatSub{
  color:#999;
  font-size:11px;
  margin-top:3px;
}

.chatHeaderActions{
  display:flex;
  gap:6px;
}

.mobileMenuBtn{
  display:none;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:20px;
}

.message{
  display:flex;
  margin-bottom:14px;
  gap:9px;
}

.message.me{
  flex-direction:row-reverse;
}

.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#e9ebf0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-size:15px;
}

.messageBody{
  max-width:min(72%,650px);
}

.messageTop{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:4px;
}

.message.me .messageTop{
  justify-content:flex-end;
}

.sender{
  font-size:12px;
  font-weight:800;
}

.time{
  font-size:10px;
  color:#999;
}

.badge{
  font-size:9px;
  border-radius:5px;
  padding:2px 5px;
  background:#202124;
  color:#fff;
}

.bubble{
  background:#fff;
  border:1px solid #e8e9ee;
  border-radius:13px;
  padding:9px 11px;
  line-height:1.45;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.me .bubble{
  background:#202124;
  color:#fff;
  border-color:#202124;
}

.messageActions{
  display:none;
  gap:3px;
  margin-top:4px;
}

.message:hover .messageActions{
  display:flex;
}

.message.me .messageActions{
  justify-content:flex-end;
}

.messageActions button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:5px;
  font-size:10px;
  padding:3px 6px;
}

.systemMessage{
  text-align:center;
  color:#8a8d96;
  font-size:12px;
  margin:12px 0;
}

.edited{
  color:#aaa;
  font-size:9px;
  margin-left:4px;
}

.typing{
  height:22px;
  padding:0 20px;
  color:#999;
  font-size:11px;
  flex-shrink:0;
}

.composer{
  background:#fff;
  border-top:1px solid #e7e9ef;
  padding:12px;
  display:flex;
  gap:8px;
  align-items:flex-end;
}

.composerInput{
  flex:1;
  resize:none;
  min-height:42px;
  max-height:130px;
  padding:11px 12px;
  border:1px solid #dddfe6;
  border-radius:11px;
  outline:none;
}

.composerInput:focus{
  border-color:#555;
}

.iconBtn{
  width:42px;
  height:42px;
  border:1px solid #dddfe6;
  background:#fff;
  border-radius:10px;
  flex-shrink:0;
}

.sendBtn{
  width:45px;
  height:42px;
  border:0;
  background:#202124;
  color:white;
  border-radius:10px;
  flex-shrink:0;
}

/* EMOJI */
.emojiPanel{
  position:absolute;
  bottom:65px;
  left:12px;
  width:300px;
  background:#fff;
  border:1px solid #ddd;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  border-radius:13px;
  padding:10px;
  display:none;
  z-index:30;
}

.emojiPanel.show{
  display:block;
}

.emojiGrid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:4px;
}

.emoji{
  border:0;
  background:#f5f5f7;
  border-radius:7px;
  padding:7px 3px;
  font-size:19px;
}

/* RIGHT */
.rightbar{
  background:#fff;
  border-left:1px solid #e7e9ef;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.rightSection{
  padding:17px;
  border-bottom:1px solid #eee;
}

.rightTitle{
  font-weight:800;
  margin-bottom:10px;
}

.userSearch{
  width:100%;
  padding:9px;
  border:1px solid #dddfe6;
  border-radius:8px;
  margin-bottom:10px;
}

.onlineList{
  max-height:350px;
  overflow:auto;
}

.onlineUser{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 3px;
}

.onlineDot{
  width:8px;
  height:8px;
  background:#40c057;
  border-radius:50%;
}

.onlineName{
  font-size:13px;
}

.roleText{
  margin-left:auto;
  color:#888;
  font-size:10px;
}

/* PRODUCER */
.producerPanel{
  display:none;
}

.producerPanel.show{
  display:block;
}

.commandItem{
  border:1px solid #e5e6eb;
  border-radius:8px;
  padding:8px;
  margin-bottom:6px;
  font-size:12px;
}

.commandItem b{
  display:block;
}

.dangerBtn{
  border:1px solid #f0b5b5;
  color:#c62828;
  background:#fff;
  border-radius:7px;
  padding:6px 8px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modalCard{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:17px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.modalTitle{
  font-size:19px;
  font-weight:800;
  margin-bottom:16px;
}

.modalActions{
  display:flex;
  gap:7px;
  margin-top:15px;
}

.modalActions button{
  flex:1;
  padding:10px;
  border-radius:9px;
  border:1px solid #ddd;
  background:#fff;
}

.modalActions .confirm{
  background:#202124;
  color:#fff;
  border-color:#202124;
}

.closeBtn{
  float:right;
  border:0;
  background:transparent;
  font-size:20px;
}

/* MOBILE */
@media(max-width:900px){
  .main{
    grid-template-columns:240px minmax(0,1fr);
  }

  .rightbar{
    display:none;
  }
}

@media(max-width:700px){
  .header{
    padding:0 12px;
  }

  .headerRight .userNameTop{
    display:none;
  }

  .main{
    display:block;
    position:relative;
  }

  .sidebar{
    position:fixed;
    top:64px;
    bottom:0;
    left:0;
    width:285px;
    z-index:50;
    transform:translateX(-105%);
    transition:.2s;
    box-shadow:10px 0 30px rgba(0,0,0,.12);
  }

  .sidebar.mobileOpen{
    transform:translateX(0);
  }

  .mobileMenuBtn{
    display:block;
    border:1px solid #dddfe6;
    background:#fff;
    border-radius:8px;
    padding:6px 9px;
    margin-right:8px;
  }

  .chatHeaderLeft{
    display:flex;
    align-items:center;
  }

  .messageBody{
    max-width:82%;
  }

  .messages{
    padding:14px 10px;
  }

  .composer{
    padding:8px;
  }

  .emojiPanel{
    left:5px;
    bottom:60px;
    width:calc(100vw - 10px);
  }

  .logo{
    font-size:18px;
  }
}

/* OVERLAY */
.mobileOverlay{
  display:none;
}

@media(max-width:700px){
  .mobileOverlay.show{
    display:block;
    position:fixed;
    inset:64px 0 0 0;
    background:rgba(0,0,0,.25);
    z-index:40;
  }
}
</style>
<link rel="stylesheet" href="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.css">
<script defer src="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.js"></script>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <a class="logo" href="https://semicolonxss.github.io/Formwheel/">
      <span>Form</span>
      <span class="logoWheel">◉</span>
      <span>Wheel</span>
    </a>

    <div class="headerRight">
      <span id="userNameTop" class="userNameTop"></span>
      <button class="logoutBtn" onclick="logout()">로그아웃</button>
    </div>
  </header>


  <!-- LOGIN -->
  <section id="loginScreen" class="loginScreen">

    <div class="loginCard">

      <div class="loginLogo">FormWheel Chat</div>
      <div class="loginSub">FormWheel 실시간 채팅</div>

      <div class="authTabs">
        <button id="loginTab" class="authTab active" onclick="switchAuth('login')">
          로그인
        </button>

        <button id="signupTab" class="authTab" onclick="switchAuth('signup')">
          회원가입
        </button>
      </div>

      <div id="nicknameField" class="field" style="display:none;">
        <label>닉네임</label>
        <input id="nicknameInput"
               maxlength="12"
               placeholder="최대 12자">
      </div>

      <div class="field">
        <label>이메일</label>
        <input id="emailInput"
               type="email"
               placeholder="example@email.com">
      </div>

      <div class="field">
        <label>비밀번호</label>
        <input id="passwordInput"
               type="password"
               placeholder="비밀번호">
      </div>

      <button id="authButton"
              class="primaryBtn"
              onclick="submitAuth()">
        로그인
      </button>

      <div id="authError" class="authError"></div>

    </div>

  </section>


  <!-- MAIN -->
  <main id="mainApp" class="main" style="display:none;">

    <!-- LEFT -->
    <aside id="sidebar" class="sidebar">

      <div class="sidebarTop">

        <div class="sidebarTitle">
          채팅
        </div>

        <input
          id="roomSearchInput"
          class="roomSearch"
          placeholder="채팅방 검색..."
          oninput="renderRoomList()"
        >

        <div class="roomActions">

          <button onclick="openCreateRoomModal()">
            ＋ 만들기
          </button>

          <button onclick="openJoinRoomModal()">
            🔑 입장
          </button>

        </div>

      </div>

      <div id="roomList" class="roomList"></div>

    </aside>


    <!-- CENTER -->
    <section class="chat">

      <div class="chatHeader">

        <div class="chatHeaderLeft">

          <button
            class="mobileMenuBtn"
            onclick="toggleMobileSidebar()">
            ☰
          </button>

          <div>
            <div id="chatTitle" class="chatTitle">
              🌎 전체톡
            </div>

            <div id="chatSub" class="chatSub">
              FormWheel 전체 채팅
            </div>
          </div>

        </div>

        <div class="chatHeaderActions">

          <button
            class="smallBtn"
            onclick="showCurrentRoomInfo()">
            ⓘ
          </button>

        </div>

      </div>


      <div id="messages" class="messages"></div>

      <div id="typing" class="typing"></div>

      <div style="position:relative;">

        <div id="emojiPanel" class="emojiPanel">

          <div class="emojiGrid">

            <button class="emoji" onclick="insertEmoji('😀')">😀</button>
            <button class="emoji" onclick="insertEmoji('😂')">😂</button>
            <button class="emoji" onclick="insertEmoji('🤣')">🤣</button>
            <button class="emoji" onclick="insertEmoji('😊')">😊</button>
            <button class="emoji" onclick="insertEmoji('😍')">😍</button>
            <button class="emoji" onclick="insertEmoji('😎')">😎</button>
            <button class="emoji" onclick="insertEmoji('🥳')">🥳</button>
            <button class="emoji" onclick="insertEmoji('🤔')">🤔</button>

            <button class="emoji" onclick="insertEmoji('👍')">👍</button>
            <button class="emoji" onclick="insertEmoji('👎')">👎</button>
            <button class="emoji" onclick="insertEmoji('👏')">👏</button>
            <button class="emoji" onclick="insertEmoji('🔥')">🔥</button>
            <button class="emoji" onclick="insertEmoji('❤️')">❤️</button>
            <button class="emoji" onclick="insertEmoji('💯')">💯</button>
            <button class="emoji" onclick="insertEmoji('🎉')">🎉</button>
            <button class="emoji" onclick="insertEmoji('✨')">✨</button>

            <button class="emoji" onclick="insertEmoji('😢')">😢</button>
            <button class="emoji" onclick="insertEmoji('😭')">😭</button>
            <button class="emoji" onclick="insertEmoji('😡')">😡</button>
            <button class="emoji" onclick="insertEmoji('😱')">😱</button>
            <button class="emoji" onclick="insertEmoji('🤯')">🤯</button>
            <button class="emoji" onclick="insertEmoji('💀')">💀</button>
            <button class="emoji" onclick="insertEmoji('👀')">👀</button>
            <button class="emoji" onclick="insertEmoji('🙌')">🙌</button>

          </div>

        </div>


        <div class="composer">

          <button
            class="iconBtn"
            onclick="toggleEmoji()">
            😊
          </button>

          <textarea
            id="messageInput"
            class="composerInput"
            maxlength="2000"
            placeholder="메시지를 입력하세요..."
            onkeydown="handleMessageKey(event)"
            oninput="handleTyping()"></textarea>

          <button
            class="sendBtn"
            onclick="sendMessage()">
            ➤
          </button>

        </div>

      </div>

    </section>


    <!-- RIGHT -->
    <aside class="rightbar">

      <div class="rightSection">

        <div class="rightTitle">
          👥 온라인 사용자
        </div>

        <input
          id="userSearchInput"
          class="userSearch"
          placeholder="사용자 검색..."
          oninput="renderUsers()">

        <div id="onlineList" class="onlineList"></div>

      </div>


      <!-- PRODUCER -->
      <div id="producerPanel"
           class="rightSection producerPanel">

        <div class="rightTitle">
          🛡️ Producer
        </div>

        <button
          class="smallBtn"
          onclick="openCommandModal()"
          style="width:100%;margin-bottom:8px;">
          ＋ 명령어 만들기
        </button>

        <div id="commandList"></div>

      </div>

    </aside>

  </main>


  <div id="mobileOverlay"
       class="mobileOverlay"
       onclick="closeMobileSidebar()"></div>

</div>


<!-- CREATE ROOM -->
<div id="createRoomModal" class="modal">

  <div class="modalCard">

    <button class="closeBtn"
            onclick="closeModal('createRoomModal')">
      ×
    </button>

    <div class="modalTitle">
      🏠 채팅방 만들기
    </div>

    <div class="field">
      <label>채팅방 이름</label>
      <input id="createRoomName"
             maxlength="30"
             placeholder="예: 게임 이야기">
    </div>

    <div class="modalActions">
      <button onclick="closeModal('createRoomModal')">
        취소
      </button>

      <button class="confirm"
              onclick="createRoom()">
        만들기
      </button>
    </div>

  </div>

</div>


<!-- JOIN ROOM -->
<div id="joinRoomModal" class="modal">

  <div class="modalCard">

    <button class="closeBtn"
            onclick="closeModal('joinRoomModal')">
      ×

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatTime(timestamp){

  if(!timestamp){
    return "";
  }

  const d = new Date(timestamp);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleTimeString("ko-KR",{
    hour:"2-digit",
    minute:"2-digit"
  });
}


function formatRoomTime(timestamp){

  if(!timestamp){
    return "";
  }

  const d = new Date(timestamp);
  const now = new Date();

  if(
    d.getFullYear() === now.getFullYear() &&
    d.getMonth() === now.getMonth() &&
    d.getDate() === now.getDate()
  ){
    return d.toLocaleTimeString("ko-KR",{
      hour:"2-digit",
      minute:"2-digit"
    });
  }

  return `${d.getMonth()+1}/${d.getDate()}`;
}

function getLocalData(){

  try{

    const raw = localStorage.getItem(LOCAL_KEY);

    if(!raw){
      return {
        rooms:{},
        unread:{},
        lastChat:{
          type:"public",
          roomId:null
        }
      };
    }

    const data = JSON.parse(raw);

    return {
      rooms:data.rooms || {},
      unread:data.unread || {},
      lastChat:data.lastChat || {
        type:"public",
        roomId:null
      }
    };

  }catch(e){

    return {
      rooms:{},
      unread:{},
      lastChat:{
        type:"public",
        roomId:null
      }
    };

  }

}


function saveLocalData(){

  if(!currentUser){
    return;

  const data = getLocalData();

  data.rooms = allRooms;
  data.unread = roomUnread;

  data.lastChat = {
    type:currentChatType,
    roomId:currentRoomId
  };

  localStorage.setItem(
    LOCAL_KEY,
    JSON.stringify(data)
  );
}


function loadLocalData(){

  const data = getLocalData();

  allRooms = data.rooms || {};

window.submitAuth = async function(){

  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;
  const nickname = $("nicknameInput").value.trim();

  $("authError").textContent = "";

  if(!email || !password){

    $("authError").textContent =
      "이메일과 비밀번호를 입력해주세요.";

    return;
  }

  try{

    if(authMode === "signup"){

      if(!nickname){

        $("authError").textContent =
          "닉네임을 입력해주세요.";

        return;
      }

      if(nickname.length > 12){

        $("authError").textContent =
          "닉네임은 최대 12자입니다.";

        return;
      }

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      await set(
        ref(db,`chatUsers/${result.user.uid}`),
        {
          uid:result.user.uid,
          nickname:nickname,
          email:email,
          role:"member",
          createdAt:Date.now()
        }
      );

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

  }catch(error){

    console.error(error);

    let message = "처리 중 오류가 발생했습니다.";

    if(error.code === "auth/invalid-credential"){
      message = "이메일 또는 비밀번호가 올바르지 않습니다.";
    }

    if(error.code === "auth/email-already-in-use"){
      message = "이미 가입된 이메일입니다.";
    }

    if(error.code === "auth/weak-password"){
      message = "비밀번호는 더 안전하게 설정해주세요.";
    }

    $("authError").textContent = message;
  }

function roomDisplayName(room){

  if(!room){
    return "";

  return room.name || "이름 없는 채팅방";
}


async function loadRooms(){

  loadLocalData();

  if(roomsUnsub){
    roomsUnsub();
  }

  roomsUnsub = onValue(
    ref(db,"chatRooms"),
    snapshot => {

      const remoteRooms =
        snapshot.val() || {};

      const merged = {};

      Object.keys(remoteRooms).forEach(roomId => {

        const room = remoteRooms[roomId];

        if(!room){
          return;
        }

        if(
          room.members &&
          room.members[currentUser.uid]
        ){

          const old =
            allRooms[roomId] || {};

          merged[roomId] = {
            ...old,
            ...room,
            joinedAt:
              old.joinedAt ||
              room.joinedAt ||
              Date.now(),

            lastMessage:
              room.lastMessage ??
              old.lastMessage ??
              "",

            lastMessageAt:
              room.lastMessageAt ??
              old.lastMessageAt ??
              room.createdAt ??
              Date.now()
          };

        }

      });

      allRooms = merged;

      saveLocalData();

      renderRoomList();

    }
  );

}


function getSortedRooms(){

  return Object.entries(allRooms)
    .sort((a,b) => {

      const ta =
        Number(a[1].lastMessageAt || a[1].joinedAt || 0);

      const tb =
        Number(b[1].lastMessageAt || b[1].joinedAt || 0);

      return tb - ta;

    });

}

function generateRoomCode(){

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for(let i=0;i<6;i++){

    result +=
      chars[
        Math.floor(
          Math.random() * chars.length
        )
      ];

  }

  return result;
}


async function uniqueRoomCode(){

  for(let i=0;i<20;i++){

    const code =
      generateRoomCode();

    const snap =
      await get(
        ref(db,`roomCodes/${code}`)
      );

    if(!snap.exists()){
      return code;
    }

  }

  throw new Error("방 코드 생성 실패");
}

 try{const snap=await get(query(historyMessageRef,orderByChild("createdAt"),endAt(oldest.createdAt,oldest.id),limitToLast(51)));if(generation!==messageGeneration)return;
 let count=0;snap.forEach(child=>{if(child.key===oldest.id)return;messageCache.set(child.key,{id:child.key,...child.val()});count++;});
 renderMessages(sortedCachedMessages());container.scrollTop=top+container.scrollHeight-height;button.textContent=count?"이전 메시지 더 보기":"이전 메시지가 없습니다";button.disabled=count===0;
 }catch{button.disabled=false;button.textContent="이전 메시지 불러오기 실패 · 다시 시도";}
}
function startMessageListener(pathName){

  stopMessageListeners();messageGeneration++;messageCache.clear();messageNodes.clear();liveMessageIds.clear();
  let earlier=$("earlierMessages");if(!earlier){earlier=document.createElement("button");earlier.id="earlierMessages";$("messages").before(earlier);}earlier.textContent="이전 메시지 보기";earlier.disabled=false;earlier.onclick=loadEarlierMessages;
  $("messages").innerHTML = "";

  const messageRef =
    ref(
      db,
      pathName === "public"
      ? "chat/public/messages"
      : `chatRooms/${currentRoomId}/messages`
    );

  historyMessageRef=messageRef;
  const q =
    query(
      messageRef,
      orderByChild("createdAt"),
      limitToLast(200)
    );

  currentMessagesUnsub =
    onValue(
      q,
      snapshot => {

        const messages = [];

        snapshot.forEach(child => {

          messages.push({
            id:child.key,
            ...child.val()
          });

        });

        const ids=new Set(messages.map(m=>m.id));
        const first=messages[0];for(const id of liveMessageIds)if(!ids.has(id)){const old=messageCache.get(id);if(!first||Number(old?.createdAt)>Number(first.createdAt)||Number(old?.createdAt)===Number(first.createdAt)&&id>=first.id)messageCache.delete(id);}
        liveMessageIds=ids;for(const m of messages)messageCache.set(m.id,m);
        renderMessages(sortedCachedMessages());

      }
    );


  const typingPath =
    pathName === "public"
    ? "typing/public"
    : `typing/room_${currentRoomId}`;

  currentTypingUnsub =
    onValue(
      ref(db,typingPath),
      snapshot => {

        const data =
          snapshot.val() || {};

        const names =
          Object.values(data)
            .filter(v => v.uid !== currentUser.uid)
            .map(v => v.nickname);

        $("typing").textContent =
          names.length
          ? `${names.join(", ")} 입력 중...`
          : "";

      }
    );

}


function renderMessages(messages){

  const container =
    $("messages");

  const wasNearBottom =
    container.scrollHeight -
    container.scrollTop -
    container.clientHeight < 100;

  const desired=new Set(messages.map(m=>m.id));
  for(const [id,entry] of messageNodes)if(!desired.has(id)){entry.node.remove();messageNodes.delete(id);}
  let previous=null;


  messages.forEach(message => {
    const signature=JSON.stringify([message,allUsers[message.uid]?.role,currentUserData?.role]);
    const existing=messageNodes.get(message.id);
    if(existing?.signature===signature){if(existing.node.previousSibling!==previous)container.insertBefore(existing.node,previous?previous.nextSibling:container.firstChild);previous=existing.node;return;}
    existing?.node.remove();

    if(message.system){

      const system =
        document.createElement("div");

      system.className =
        "systemMessage";

      system.textContent =
        message.text || "";

      container.insertBefore(system,previous?previous.nextSibling:container.firstChild);previous=system;messageNodes.set(message.id,{signature,node:system});

      return;
    }


    const isMe =
      message.uid === currentUser.uid;

    const div =
      document.createElement("div");

    div.className =
      "message" +
      (isMe ? " me" : "");


    const role =
      allUsers[message.uid]?.role ||
      message.role ||
      "member";


    div.innerHTML = `

      <div class="avatar">
        ${isMe ? "🙂" : "👤"}
      </div>

      <div class="messageBody">

        <div class="messageTop">

          <span class="sender">
            ${escapeHtml(message.nickname || "사용자")}
          </span>

          ${
            role === "producer"
            ? `<span class="badge">Producer</span>`
            : ""
          }

          <span class="time">
            ${formatTime(message.createdAt)}
          </span>

        </div>

        <div class="bubble">
          ${escapeHtml(message.text || "")}

          ${
            message.edited
            ? `<span class="edited">(수정됨)</span>`
            : ""
          }
        </div>

        <div class="messageActions">

          ${
            isMe || currentUserData?.role === "producer"
            ? `
              <button data-message-action="edit" aria-label="메시지 수정">
                ✏️
              </button>
            `
            : ""
          }

          ${
            isMe || currentUserData?.role === "producer"
            ? `
              <button data-message-action="delete" aria-label="메시지 삭제">
                🗑️
              </button>
            `
            : ""
          }

          ${
            !isMe &&
            currentUserData?.role === "producer"
            ? `
              <button data-message-action="ban" aria-label="사용자 차단">
                🚫
              </button>
            `
            : ""
          }

        </div>

      </div>

    `;

    div.querySelector('[data-message-action="edit"]')?.addEventListener('click',()=>window.openEditMessage(message.id,message.text||""));
    div.querySelector('[data-message-action="delete"]')?.addEventListener('click',()=>window.deleteMessage(message.id));
    div.querySelector('[data-message-action="ban"]')?.addEventListener('click',()=>window.openBanModal(message.uid,message.nickname||"사용자"));
    container.insertBefore(div,previous?previous.nextSibling:container.firstChild);previous=div;messageNodes.set(message.id,{signature,node:div});

  });


  if(wasNearBottom || messages.length <= 1){

    container.scrollTop =
      container.scrollHeight;

  }

}


/* =========================================================
   SEND
========================================================= */

window.sendMessage = async function(){

  if(!currentUser){
    return;
  }

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if(!text){
    return;
  }


  /* COMMAND */

  if(text.startsWith("@")){

    const commandResult =
      await handleCommand(text);

    if(commandResult){
      input.value = "";
      stopTyping();
      return;
    }

  }


  const path =
    currentChatType === "public"
    ? "chat/public/messages"
    : `chatRooms/${currentRoomId}/messages`;

  const messageRef =
    push(ref(db,path));

  const now =
    Date.now();

  const message = {

    uid:currentUser.uid,

    nickname:
      currentUserData?.nickname ||
      "사용자",

    role:
      currentUserData?.role ||
      "member",

    text,

    createdAt:now,

    edited:false

  };


  await set(
    messageRef,
    message
  );


  /* ROOM SIDEBAR */

  if(currentChatType === "room"){

    const roomSnap =
      await get(
        ref(db,`chatRooms/${currentRoomId}`)
      );

    if(roomSnap.exists()){

      const room =
        roomSnap.val();

      const members =
        room.members || {};

      const updates = {};

      Object.keys(members).forEach(uid => {

        updates[
          `userChatMeta/${uid}/${currentRoomId}/lastMessage`
        ] = text;

        updates[
          `userChatMeta/${uid}/${currentRoomId}/lastMessageAt`
        ] = now;

      });

      updates[
        `chatRooms/${currentRoomId}/lastMessage`
      ] = text;

      updates[
        `chatRooms/${currentRoomId}/lastMessageAt`
      ] = now;

      await update(
        ref(db),
        updates
      );

    }

    allRooms[currentRoomId] = {
      ...(allRooms[currentRoomId] || {}),
      lastMessage:text,
      lastMessageAt:now
    };

  }else{

    /* PUBLIC */

    localStorage.setItem(
      "formwheel_chat_public_last",
      JSON.stringify({
        text,
        at:now
      })
    );

  }


  input.value = "";

  stopTyping();

  saveLocalData();

  renderRoomList();

};


window.handleMessageKey =
function(event){

  if(event.key === "Enter" && !event.shiftKey){

    event.preventDefault();

    sendMessage();

  }

};

function(emoji){

  commandsUnsub =
    onValue(
      ref(db,"chatCommands"),
      snapshot => {

        allCommands =
          snapshot.val() || {};

function renderCommands(){

  const list =
    $("commandList");

  if(!list){
    return;

  list.innerHTML = "";

  Object.entries(allCommands)
    .forEach(([id,command]) => {

      const div =

        <b>${escapeHtml(command.name)}</b>

      `;

    });

function(){

window.saveCommand =
async function(){

    return;
  }

  let name =
    $("commandName")
      .value
      .trim();

  const text =
    $("commandText")

  );

};


/* =========================================================
   COMMAND EXECUTION
========================================================= */

async function handleCommand(text){

  const parts =
    text.split(/\s+/);

  const name =
    parts[0];

  const command =
    Object.values(allCommands)
      .find(c =>
        String(c.name).toLowerCase() ===
        name.toLowerCase()
      );


  /* 기본 명령어 */

  if(name === "@봇소환"){

    await sendSystemMessage(
      "🤖 FormWheel Bot이 채팅에 등장했습니다!"
    );

    return true;

  }


  if(name === "@사용자검색"){

    const keyword =
      parts.slice(1).join(" ").trim();

    if(!keyword){

      await sendSystemMessage(
        "🔎 사용법: @사용자검색 닉네임"
      );

      return true;

    }


    const results =
      Object.values(allUsers)
        .filter(user =>
          String(user.nickname || "")
            .toLowerCase()
            .includes(keyword.toLowerCase())
        )
        .slice(0,10);


    if(results.length === 0){

      await sendSystemMessage(
        `🔎 "${keyword}" 사용자를 찾지 못했습니다.`
      );

    }else{

      await sendSystemMessage(
        "🔎 검색 결과: " +
        results
          .map(user => user.nickname)
          .join(", ")
      );

    }

    return true;

  }


  if(!command){
    return false;
  }


  if(command.action === "search"){

    const keyword =
      parts.slice(1).join(" ").trim();

    const results =
      Object.values(allUsers)
        .filter(user =>
          String(user.nickname || "")
            .toLowerCase()
            .includes(keyword.toLowerCase())
        )
        .slice(0,10);

    await sendSystemMessage(
      results.length
      ? "🔎 " + results.map(x => x.nickname).join(", ")
      : "🔎 검색 결과가 없습니다."
    );

    return true;
  }


  if(command.action === "bot"){

    await sendSystemMessage(
      `🤖 ${command.text || "Bot이 응답했습니다."}`
    );

    return true;

  }


  await sendSystemMessage(
    command.text || ""
  );

  return true;

}


/* =========================================================
   SYSTEM MESSAGE
========================================================= */

async function sendSystemMessage(text){

  const path =
    currentChatType === "public"
    ? "chat/public/messages"
    : `chatRooms/${currentRoomId}/messages`;


  const messageRef =
    push(ref(db,path));

  const now =
    Date.now();


  await set(
    messageRef,
    {
      system:true,
      text,
      createdAt:now
    }
  );


  if(currentChatType === "room"){

    const roomSnap =
      await get(
        ref(db,`chatRooms/${currentRoomId}`)
      );

    if(roomSnap.exists()){

      const room =
        roomSnap.val();

      const updates = {};

      Object.keys(room.members || {})
        .forEach(uid => {

          updates[
            `userChatMeta/${uid}/${currentRoomId}/lastMessage`
          ] = text;

          updates[
            `userChatMeta/${uid}/${currentRoomId}/lastMessageAt`
          ] = now;

        });


      updates[
        `chatRooms/${currentRoomId}/lastMessage`
      ] = text;

      updates[
        `chatRooms/${currentRoomId}/lastMessageAt`
      ] = now;


      await update(
        ref(db),
        updates
      );

    }

    allRooms[currentRoomId] = {
      ...(allRooms[currentRoomId] || {}),
      lastMessage:text,
      lastMessageAt:now
    };

    saveLocalData();

    renderRoomList();

  }

}

window.openBanModal =
function(uid,nickname){

  if(currentUserData?.role !== "producer"){
    return;
  }

  banTargetUid = uid;

  $("banTargetText").textContent =
    `${nickname} 사용자를 Ban합니다.`;

  $("banModal")
    .classList.add("show");

};


window.banUser =
async function(){

  if(
    !banTargetUid ||
    currentUserData?.role !== "producer"
  ){
    return;
  }

  const minutes =
    Number(
      $("banMinutes").value
    );

  const until =
    Date.now() +
    minutes * 60 * 1000;


  await set(
    ref(db,`chatBans/${banTargetUid}`),
    {
      uid:banTargetUid,
      until,
      by:currentUser.uid,
      createdAt:Date.now()
    }
  );


  closeModal("banModal");

  banTargetUid = null;

  await sendSystemMessage(
    `🚫 사용자가 ${minutes}분 동안 Ban되었습니다.`
  );

};


/* =========================================================
   BAN CHECK
========================================================= */

async function checkBan(){

  if(!currentUser){
    return false;
  }

  const snap =
    await get(
      ref(db,`chatBans/${currentUser.uid}`)
    );

  if(!snap.exists()){
    return false;
  }

  const ban =
    snap.val();

  if(
    ban.until &&
    Date.now() < ban.until
  ){

    alert(
      `현재 채팅이 제한되어 있습니다.\n` +
      `해제 시간: ${new Date(ban.until).toLocaleString("ko-KR")}`
    );

    return true;

  }

  await remove(
    ref(db,`chatBans/${currentUser.uid}`)
  );

  return false;

}

window.sendMessage =

/* =========================================================

========================================================= */

async function restoreLastChat(){

  const data =
    getLocalData();

  if(
    data.lastChat &&
    data.lastChat.type === "room" &&
    data.lastChat.roomId
  ){

    const roomId =
      data.lastChat.roomId;

    const roomSnap =
      await get(
        ref(db,`chatRooms/${roomId}`)
      );

    if(
      roomSnap.exists() &&
      roomSnap.val().members?.[currentUser.uid]
    ){

      await openRoom(roomId);

      return;

    }

  }

  await openPublicChat();

}

========================================================= */

onAuthStateChanged(

  async user => {

    currentUser = user;

    if(!user){

      $("mainApp").style.display =

      stopMessageListeners();

      return;

    await loadCurrentUser();

    loadLocalData();

    await setOnline();

    await loadUsers();

    await loadRooms();

    await loadCommands();

    await restoreLastChat();

  }
);
