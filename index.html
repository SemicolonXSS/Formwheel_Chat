<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FormWheel Chat</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f7f8fc;
  color:#202124;
  height:100vh;
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  height:64px;
  background:white;
  border-bottom:1px solid #e8eaf0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:relative;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:800;
  text-decoration:none;
  color:#222;
  display:flex;
  align-items:center;
  gap:7px;
}

.logo-wheel{
  width:28px;
  height:28px;
  border-radius:50%;
  border:6px dotted #5b5ff0;
  display:inline-block;
}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#22c55e;
}

.nickname{
  font-size:14px;
  font-weight:700;
}

.change-name{
  border:0;
  background:#f1f2f7;
  padding:7px 10px;
  border-radius:9px;
  font-size:12px;
}

.app{
  height:calc(100vh - 64px);
  display:flex;
  max-width:1400px;
  margin:auto;
}

/* SIDEBAR */

.sidebar{
  width:290px;
  background:white;
  border-right:1px solid #e7e8ed;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}

.sidebar-top{
  padding:18px;
  border-bottom:1px solid #eee;
}

.sidebar-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:15px;
}

.action-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.action-btn{
  border:0;
  background:#f1f2f7;
  padding:12px 8px;
  border-radius:11px;
  font-weight:700;
  font-size:13px;
  transition:.15s;
}

.action-btn:hover{
  background:#e6e7ef;
  transform:translateY(-1px);
}

.action-btn.primary{
  background:#5b5ff0;
  color:white;
}

.chat-list{
  flex:1;
  overflow-y:auto;
}

.section-title{
  font-size:12px;
  font-weight:800;
  color:#8a8d98;
  padding:17px 17px 8px;
}

.chat-item{
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
  transition:.12s;
}

.chat-item:hover{
  background:#f5f6fa;
}

.chat-item.active{
  background:#eef0ff;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,#6c63ff,#8b5cf6);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:800;
  flex-shrink:0;
}

.avatar.small{
  width:35px;
  height:35px;
  font-size:15px;
}

.chat-info{
  min-width:0;
  flex:1;
}

.chat-name{
  font-size:14px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-preview{
  color:#8c8f99;
  font-size:12px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* MAIN CHAT */

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#f7f8fc;
}

.chat-header{
  height:68px;
  background:white;
  border-bottom:1px solid #e7e8ed;
  display:flex;
  align-items:center;
  padding:0 22px;
  gap:12px;
}

.chat-header-info{
  flex:1;
}

.chat-header-title{
  font-size:17px;
  font-weight:800;
}

.chat-header-sub{
  font-size:12px;
  color:#8b8d95;
  margin-top:3px;
}

.search-box{
  width:190px;
  background:#f4f5f8;
  border:0;
  border-radius:9px;
  padding:9px 11px;
  outline:none;
  font-size:13px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:24px 24px 15px;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#9295a0;
  text-align:center;
}

.empty-icon{
  font-size:50px;
  margin-bottom:14px;
}

.empty-title{
  color:#444;
  font-size:18px;
  font-weight:800;
  margin-bottom:7px;
}

.message-row{
  display:flex;
  gap:9px;
  margin-bottom:15px;
  align-items:flex-end;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.mine .message-avatar{
  display:none;
}

.message-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#6c63ff;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:13px;
  font-weight:800;
  flex-shrink:0;
}

.message-content{
  max-width:min(70%,620px);
}

.message-name{
  font-size:11px;
  color:#858894;
  margin-bottom:4px;
}

.message-row.mine .message-content{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.bubble-line{
  display:flex;
  gap:5px;
  align-items:flex-end;
}

.bubble{
  background:white;
  border:1px solid #e8e9ef;
  padding:10px 12px;
  border-radius:15px;
  border-bottom-left-radius:5px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
}

.mine .bubble{
  background:#5b5ff0;
  color:white;
  border-color:#5b5ff0;
  border-bottom-left-radius:15px;
  border-bottom-right-radius:5px;
}

.message-time{
  font-size:10px;
  color:#999ca6;
  white-space:nowrap;
}

.mine .message-time{
  color:#999ca6;
}

.message-actions{
  margin-top:4px;
  display:flex;
  gap:5px;
}

.message-actions button{
  border:0;
  background:transparent;
  color:#999;
  font-size:10px;
  padding:2px;
}

.message-actions button:hover{
  color:#555;
}

.typing{
  height:24px;
  padding:0 25px;
  color:#888b96;
  font-size:11px;
}

.composer{
  background:white;
  border-top:1px solid #e7e8ed;
  padding:12px 16px;
  position:relative;
}

.composer-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  background:#f1f2f6;
  border-radius:11px;
  font-size:20px;
}

.message-input{
  flex:1;
  min-height:40px;
  max-height:120px;
  resize:none;
  border:0;
  background:#f4f5f8;
  border-radius:12px;
  padding:11px 13px;
  outline:none;
  font-size:14px;
}

.send-btn{
  width:45px;
  height:40px;
  border:0;
  border-radius:11px;
  background:#5b5ff0;
  color:white;
  font-size:17px;
  font-weight:800;
}

.send-btn:disabled{
  background:#c7c9d4;
  cursor:not-allowed;
}

/* EMOJI */

.emoji-panel{
  position:absolute;
  left:16px;
  bottom:70px;
  width:310px;
  background:white;
  border:1px solid #dddfe6;
  box-shadow:0 12px 35px rgba(0,0,0,.12);
  border-radius:15px;
  padding:12px;
  display:none;
  z-index:20;
}

.emoji-panel.show{
  display:block;
}

.emoji-title{
  font-size:12px;
  font-weight:800;
  margin-bottom:9px;
}

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:3px;
}

.emoji-grid button{
  border:0;
  background:transparent;
  font-size:23px;
  padding:5px;
  border-radius:8px;
}

.emoji-grid button:hover{
  background:#f0f1f5;
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal-bg.show{
  display:flex;
}

.modal{
  background:white;
  width:min(420px,100%);
  border-radius:18px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal h2{
  font-size:20px;
  margin-bottom:7px;
}

.modal-desc{
  color:#858894;
  font-size:13px;
  margin-bottom:18px;
}

.modal-input{
  width:100%;
  border:1px solid #dddfe7;
  border-radius:10px;
  padding:12px;
  outline:none;
  margin-bottom:10px;
}

.modal-input:focus{
  border-color:#6c63ff;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.modal-buttons button{
  flex:1;
  border:0;
  padding:12px;
  border-radius:10px;
  font-weight:800;
}

.cancel{
  background:#f0f1f5;
}

.confirm{
  background:#5b5ff0;
  color:white;
}

/* MOBILE */

.mobile-menu{
  display:none;
}

@media(max-width:750px){
  .sidebar{
    width:230px;
  }

  .search-box{
    display:none;
  }

  .message-content{
    max-width:82%;
  }
}

@media(max-width:600px){
  .sidebar{
    width:70px;
  }

  .sidebar-title,
  .action-btn span,
  .chat-info,
  .section-title,
  .change-name,
  .nickname{
    display:none;
  }

  .sidebar-top{
    padding:10px;
  }

  .action-grid{
    display:block;
  }

  .action-btn{
    width:50px;
    height:45px;
    margin-bottom:6px;
    padding:0;
    font-size:18px;
  }

  .chat-item{
    justify-content:center;
    padding:10px;
  }

  .avatar{
    width:43px;
    height:43px;
  }

  .user-area{
    gap:0;
  }

  header{
    padding:0 12px;
  }

  .messages{
    padding:18px 12px 10px;
  }

  .chat-header{
    padding:0 12px;
  }

  .composer{
    padding:9px;
  }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="https://semicolonxss.github.io/Formwheel/">
    <span>Form</span>
    <span class="logo-wheel"></span>
    <span>Wheel</span>
  </a>

  <div class="user-area">
    <span class="status-dot"></span>
    <span class="nickname" id="myNickname">접속 중...</span>
    <button class="change-name" onclick="openNicknameModal()">닉네임 변경</button>
  </div>
</header>

<div class="app">

  <aside class="sidebar">

    <div class="sidebar-top">
      <div class="sidebar-title">💬 Chat</div>

      <div class="action-grid">
        <button class="action-btn primary" onclick="openRoomCreate()">
          ➕ <span>방 만들기</span>
        </button>

        <button class="action-btn" onclick="openRoomJoin()">
          🔢 <span>방 입장</span>
        </button>

        <button class="action-btn" onclick="openPrivateSearch()">
          👤 <span>개인톡</span>
        </button>

        <button class="action-btn" onclick="openPublicChat()">
          🌐 <span>전체채팅</span>
        </button>
      </div>
    </div>

    <div class="chat-list">

      <div class="section-title">채팅</div>

      <div class="chat-item active" id="publicChatItem" onclick="openPublicChat()">
        <div class="avatar">🌐</div>
        <div class="chat-info">
          <div class="chat-name">전체 채팅</div>
          <div class="chat-preview">FormWheel 전체 채팅방</div>
        </div>
      </div>

      <div id="roomList"></div>

      <div class="section-title">온라인 사용자</div>
      <div id="userList"></div>

    </div>

  </aside>

  <main class="chat">

    <div class="chat-header">

      <div class="avatar small" id="chatAvatar">🌐</div>

      <div class="chat-header-info">
        <div class="chat-header-title" id="chatTitle">
          전체 채팅
        </div>

        <div class="chat-header-sub" id="chatSub">
          FormWheel 사용자들과 대화하세요
        </div>
      </div>

      <input
        class="search-box"
        id="searchInput"
        placeholder="메시지 검색..."
        oninput="filterMessages()"
      >

    </div>

    <div class="messages" id="messages">

      <div class="empty">
        <div class="empty-icon">💬</div>
        <div class="empty-title">FormWheel Chat</div>
        <div>메시지를 보내 대화를 시작해보세요!</div>
      </div>

    </div>

    <div class="typing" id="typingText"></div>

    <div class="composer">

      <div class="emoji-panel" id="emojiPanel">
        <div class="emoji-title">😀 이모티콘</div>

        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <div class="composer-row">

        <button class="icon-btn" onclick="toggleEmoji()">
          😀
        </button>

        <textarea
          class="message-input"
          id="messageInput"
          placeholder="메시지를 입력하세요..."
          rows="1"
          oninput="handleTyping()"
          onkeydown="handleInputKey(event)"
        ></textarea>

        <button
          class="send-btn"
          id="sendButton"
          onclick="sendMessage()"
          disabled
        >
          ➤
        </button>

      </div>

    </div>

  </main>

</div>


<!-- ROOM CREATE -->

<div class="modal-bg" id="roomCreateModal">
  <div class="modal">

    <h2>➕ 채팅방 만들기</h2>

    <div class="modal-desc">
      4자리 코드로 친구가 입장할 수 있는 방을 만듭니다.
    </div>

    <input
      class="modal-input"
      id="roomNameInput"
      maxlength="30"
      placeholder="채팅방 이름"
    >

    <div class="modal-buttons">
      <button class="cancel" onclick="closeModals()">취소</button>
      <button class="confirm" onclick="createRoom()">방 만들기</button>
    </div>

  </div>
</div>


<!-- ROOM JOIN -->

<div class="modal-bg" id="roomJoinModal">
  <div class="modal">

    <h2>🔢 채팅방 입장</h2>

    <div class="modal-desc">
      친구에게 받은 4자리 코드를 입력하세요.
    </div>

    <input
      class="modal-input"
      id="roomCodeInput"
      maxlength="4"
      inputmode="numeric"
      placeholder="예: 2387"
    >

    <div class="modal-buttons">
      <button class="cancel" onclick="closeModals()">취소</button>
      <button class="confirm" onclick="joinRoom()">입장</button>
    </div>

  </div>
</div>


<!-- PRIVATE SEARCH -->

<div class="modal-bg" id="privateSearchModal">
  <div class="modal">

    <h2>👤 개인톡</h2>

    <div class="modal-desc">
      아래에서 사용자를 선택해 1:1 채팅을 시작하세요.
    </div>

    <div id="privateUserList"></div>

    <div class="modal-buttons">
      <button class="cancel" onclick="closeModals()">닫기</button>
    </div>

  </div>
</div>


<!-- NICKNAME -->

<div class="modal-bg" id="nicknameModal">
  <div class="modal">

    <h2>✏️ 닉네임 변경</h2>

    <div class="modal-desc">
      최대 12자까지 사용할 수 있습니다.
    </div>

    <input
      class="modal-input"
      id="nicknameInput"
      maxlength="12"
      placeholder="새 닉네임"
    >

    <div class="modal-buttons">
      <button class="cancel" onclick="closeModals()">취소</button>
      <button class="confirm" onclick="changeNickname()">변경</button>
    </div>

  </div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  update,
  remove,
  get,
  onValue,
  onChildAdded,
  onChildRemoved,
  onDisconnect,
  serverTimestamp,
  query,
  orderByChild,
  limitToLast
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",
  authDomain: "formwheel.firebaseapp.com",
  databaseURL: "https://formwheel-default-rtdb.firebaseio.com",
  projectId: "formwheel",
  storageBucket: "formwheel.firebasestorage.app",
  messagingSenderId: "431583088241",
  appId: "1:431583088241:web:74e0e34ea1e3e1170c55d0",
  measurementId: "G-T372YXDF8D8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);


/* =========================
   GLOBAL STATE
========================= */

let currentUser = null;

let nickname =
  localStorage.getItem("formwheel_chat_nickname") ||
  "사용자";

let currentChatType = "public";

let currentRoomId = null;
let currentPrivateId = null;

let messagesCache = [];

let unsubscribeMessages = null;

let typingTimer = null;

let allUsers = {};


/* =========================
   EMOJIS
========================= */

const emojis = [
  "😀","😃","😄","😁","😆","😅","😂","🤣",
  "😊","😇","🙂","🙃","😉","😌","😍","🥰",
  "😘","😎","🤩","🥳","🤔","🧐","🤨","😐",
  "😑","😶","🙄","😏","😣","😥","😮","🤐",
  "😯","😪","😫","🥱","😴","🤗","🤭","🫢",
  "😱","😨","😰","😢","😭","😤","😡","🤬",
  "👍","👎","👏","🙌","🙏","💪","❤️","💙",
  "💚","💛","🧡","💜","🖤","🤍","🔥","✨",
  "🎉","🎊","💯","⭐","🌟","💥","💫","🎮",
  "🎲","🎵","🎶","🍀","🍕","🍔","🍟","🐶",
  "🐱","🦊","🐻","🐼","🐸","🐵","🙈","👀"
];

const emojiGrid = document.getElementById("emojiGrid");

emojis.forEach(emoji => {

  const button = document.createElement("button");

  button.textContent = emoji;

  button.onclick = () => {

    const input = document.getElementById("messageInput");

    input.value += emoji;

    input.focus();

    updateSendButton();

  };

  emojiGrid.appendChild(button);

});


/* =========================
   AUTH
========================= */

signInAnonymously(auth)
  .catch(error => {
    console.error(error);

    alert(
      "Firebase 익명 로그인이 활성화되어 있지 않습니다.\n\n" +
      "Firebase Console → Authentication → Sign-in method → 익명(Anonymous)을 활성화해주세요."
    );
  });


onAuthStateChanged(auth, async user => {

  if (!user) return;

  currentUser = user;

  document.getElementById("myNickname").textContent = nickname;

  await setupUser();

  setupOnlineStatus();

  loadUsers();

  loadRooms();

  openPublicChat();

});


/* =========================
   USER SETUP
========================= */

async function setupUser(){

  const userRef = ref(db, `chatUsers/${currentUser.uid}`);

  const snapshot = await get(userRef);

  if (!snapshot.exists()) {

    await set(userRef, {

      uid: currentUser.uid,

      nickname: nickname,

      online: true,

      createdAt: serverTimestamp(),

      lastSeen: serverTimestamp()

    });

  } else {

    await update(userRef, {

      nickname: nickname,

      online: true,

      lastSeen: serverTimestamp()

    });

  }

}


/* =========================
   ONLINE STATUS
========================= */

function setupOnlineStatus(){

  const userRef =
    ref(db, `chatUsers/${currentUser.uid}`);

  onDisconnect(userRef).update({

    online:false,

    lastSeen:serverTimestamp()

  });

  update(userRef, {

    online:true,

    lastSeen:serverTimestamp()

  });

}


/* =========================
   LOAD USERS
========================= */

function loadUsers(){

  const usersRef = ref(db, "chatUsers");

  onValue(usersRef, snapshot => {

    allUsers = snapshot.val() || {};

    renderUsers();

  });

}


function renderUsers(){

  const userList =
    document.getElementById("userList");

  userList.innerHTML = "";

  Object.values(allUsers)
    .filter(user => user.uid !== currentUser?.uid)
    .sort((a,b) => Number(b.online) - Number(a.online))
    .forEach(user => {

      const item =

========================= */

window.openRoomCreate = function(){

  closeModals();

    .classList.add("show");

    .getElementById("roomNameInput")
    .focus();

};


window.createRoom = async function(){

  const name =
    document
      .getElementById("roomNameInput")
      .value
      .trim();

  if (!name){

    alert("채팅방 이름을 입력해주세요.");

    return;

  }

  if (!currentUser) return;

  let code = "";

  let exists = true;

  while(exists){

    code =
      String(
        Math.floor(
          1000 + Math.random() * 9000
        )
      );

    const check =
      await get(
        ref(db, `roomCodes/${code}`)
      );

    exists = check.exists();

  }

  const roomRef =
    push(ref(db, "chatRooms"));

  const roomId =
    roomRef.key;

  await set(roomRef, {

    roomId:roomId,

    name:name,

    code:code,

    owner:currentUser.uid,

    createdAt:serverTimestamp()

  });

  await set(
    ref(db, `roomCodes/${code}`),
    roomId
  );

  await set(
    ref(db, `chatRooms/${roomId}/members/${currentUser.uid}`),
    true
  );

  closeModals();

  alert(
    `채팅방이 만들어졌습니다!\n\n입장 코드: ${code}`
  );

  openRoom(roomId);

};

========================= */

function loadRooms(){

/* =========================
   OPEN ROOM
========================= */

async function openRoom(roomId){

  const roomSnap =
    await get(
      ref(db, `chatRooms/${roomId}`)
    );

  if (!roomSnap.exists()) return;

  const room =
    roomSnap.val();

  if (
    !room.members ||
    !room.members[currentUser.uid]
  ){

    await set(
      ref(
        db,
        `chatRooms/${roomId}/members/${currentUser.uid}`
      ),
      true
    );

  }

  currentChatType = "room";

  currentRoomId = roomId;

  currentPrivateId = null;

  document.getElementById("chatTitle").textContent =
    room.name;

  document.getElementById("chatSub").textContent =
    `입장 코드 ${room.code}`;

  document.getElementById("chatAvatar").textContent =
    "🔒";

  clearActiveItems();

  listenMessages(
    `chatRooms/${roomId}/messages`
  );

}

}

/* =========================
   MESSAGE LISTENER
========================= */

function listenMessages(path){

  if (unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages = null;

  }

  const messagesRef =
    query(
      ref(db, path),
      orderByChild("createdAt"),
      limitToLast(100)
    );

  messagesCache = [];

  const callback =
    snapshot => {

      const data =
        snapshot.val() || {};

      messagesCache =
        Object.entries(data)
          .map(([id,message]) => ({
            id,
            ...message
          }))
          .sort(
            (a,b) =>
              (a.createdAt || 0) -
              (b.createdAt || 0)
          );

      renderMessages();

    };

  onValue(messagesRef, callback);

  unsubscribeMessages = () => {};

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(){

  const container =
    document.getElementById("messages");

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  let messages =
    messagesCache;

  if (search){

    messages =
      messages.filter(message =>
        String(message.text || "")
          .toLowerCase()
          .includes(search)
      );

  }

  if (!messages.length){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">💬</div>

        <div class="empty-title">
          아직 메시지가 없습니다.
        </div>

        <div>
          첫 메시지를 보내보세요!
        </div>

      </div>

    `;

    return;

  }

  container.innerHTML = "";

  messages.forEach(message => {

    const mine =
      message.uid === currentUser?.uid;

    const row =
      document.createElement("div");

    row.className =
      "message-row" +
      (mine ? " mine" : "");

    const time =
      formatTime(message.createdAt);

    row.innerHTML = `

      ${
        mine
        ? ""
        : `
          <div class="message-avatar">
            ${escapeHtml(
              (message.nickname || "?").charAt(0)
            )}
          </div>
        `
      }

      <div class="message-content">

        ${
          mine
          ? ""
          : `
            <div class="message-name">
              ${escapeHtml(
                message.nickname || "사용자"
              )}
            </div>
          `
        }

        <div class="bubble-line">

          <div class="bubble">
            ${escapeHtml(message.text || "")}
          </div>

          <div class="message-time">
            ${time}
          </div>

        </div>

        ${
          mine
          ? `
            <div class="message-actions">

              <button
                onclick="copyMessage('${message.id}')">
                복사
              </button>

              <button
                onclick="deleteMessage('${message.id}')">
                삭제
              </button>

            </div>
          `
          : ""
        }

      </div>

    `;

    container.appendChild(row);

  });

  container.scrollTop =
    container.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

window.sendMessage = async function(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if (!text || !currentUser) return;

  let path = "";

  if (currentChatType === "public"){

    path = "chat/public/messages";

  }

  else if (currentChatType === "room"){

    if (!currentRoomId) return;

    path =
      `chatRooms/${currentRoomId}/messages`;

  }

  else if (currentChatType === "private"){

    if (!currentPrivateId) return;

    path =
      `privateChats/${currentPrivateId}/messages`;

  }

  const messageRef =
    push(ref(db,path));

  await set(messageRef, {

    uid:currentUser.uid,

    nickname:nickname,

    text:text,

    createdAt:serverTimestamp()

  });

  input.value = "";

  updateSendButton();

  clearTyping();

  input.focus();

};


/* =========================
   MESSAGE DELETE
========================= */

window.deleteMessage = async function(messageId){

  const message =
    messagesCache.find(
      m => m.id === messageId
    );

  if (!message) return;

  if (
    message.uid !== currentUser.uid
  ){

    return;

  }

  let path = "";

  if (currentChatType === "public"){

    path =
      `chat/public/messages/${messageId}`;

  }

  else if (currentChatType === "room"){

    path =
      `chatRooms/${currentRoomId}/messages/${messageId}`;

  }

  else if (currentChatType === "private"){

    path =
      `privateChats/${currentPrivateId}/messages/${messageId}`;

  }

  await remove(ref(db,path));

};


/* =========================
   COPY
========================= */

window.copyMessage = async function(messageId){

  const message =
    messagesCache.find(
      m => m.id === messageId
    );

  if (!message) return;

  try{

    await navigator.clipboard.writeText(
      message.text
    );

    alert("메시지를 복사했습니다.");

  }catch{

    alert("복사에 실패했습니다.");

  }

};


/* =========================
   TYPING
========================= */

function typingPath(){

  if (
    currentChatType === "public"
  ){

    return "typing/public";

  }

  if (
    currentChatType === "room"
  ){

    return `typing/room_${currentRoomId}`;

  }

  if (
    currentChatType === "private"
  ){

    return `typing/private_${currentPrivateId}`;

  }

  return null;

}


function handleTyping(){

  updateSendButton();

  const path =
    typingPath();

  if (!path || !currentUser) return;

  const typingRef =
    ref(
      db,
      `${path}/${currentUser.uid}`
    );

  set(typingRef, {

    nickname:nickname,

    at:serverTimestamp()

  });

  clearTimeout(typingTimer);

  typingTimer =
    setTimeout(
      clearTyping,
      1500
    );

}


function clearTyping(){

  clearTimeout(typingTimer);

  const path =
    typingPath();

  if (!path || !currentUser) return;

  remove(
    ref(
      db,
      `${path}/${currentUser.uid}`
    )
  );

}


/* =========================
   TYPING LISTENER
========================= */

onAuthStateChanged(auth,user => {

  if (!user) return;

  setInterval(async () => {

    const path =
      typingPath();

    if (!path) return;

    const snapshot =
      await get(
        ref(db,path)
      );

    const data =
      snapshot.val() || {};

    const others =
      Object.values(data)
        .filter(
          item =>
            item.nickname &&
            item.nickname !== nickname
        );

    const typing =
      document.getElementById("typingText");

    if (others.length){

      if (others.length === 1){

        typing.textContent =
          `${others[0].nickname}님이 입력 중...`;

      }else{

        typing.textContent =
          `${others.length}명이 입력 중...`;

      }

    }else{

      typing.textContent = "";

    }

  },1000);

});

  document.getElementById("sendButton")

window.handleInputKey = function(event){

/* =========================
   UTIL
========================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatTime(timestamp){

  if (!timestamp){

    return "";

  }

  const date =
    new Date(timestamp);

  if (isNaN(date.getTime())){

    return "";

  }

  return date.toLocaleTimeString(
    "ko-KR",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}
