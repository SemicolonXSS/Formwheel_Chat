<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FormWheel Chat</title>

<link rel="stylesheet" href="./assets/styles.css">
<link rel="stylesheet" href="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.css">
<script defer src="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.js"></script>
<meta property="og:title" content="Chat · Formwheel">
<meta property="og:description" content="방을 만들고 친구들과 실시간으로 대화하는 채팅 앱.">
<meta property="og:image" content="https://semicolonxss.github.io/Formwheel_Chat/assets/thumbnail.svg">
<link rel="stylesheet" href="assets/formwheel-brand.css?v=20261008-hub-logo">
<link rel="icon" type="image/svg+xml" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <a class="logo fw-hub-logo" href="https://semicolonxss.github.io/Formwheel/" aria-label="FormWheel 메인으로 이동"><span class="fw-hub-form">Form</span><span class="fw-hub-icon" aria-hidden="true"></span><span class="fw-hub-wheel">Wheel</span></a>

    <div class="headerRight">
      <span id="userNameTop" class="userNameTop"></span>
      <button class="logoutBtn" onclick="logout()">로그아웃</button>
    </div>
  </header>


  <!-- LOGIN -->
  <section id="loginScreen" class="loginScreen">

    <div class="loginCard">

      <div class="loginLogo">FormWheel Chat</div>
      <div class="loginSub">FormWheel 실시간 채팅</div>

      <div class="authTabs">
        <button id="loginTab" class="authTab active" onclick="switchAuth('login')">
          로그인
        </button>

        <button id="signupTab" class="authTab" onclick="switchAuth('signup')">
          회원가입
        </button>
      </div>

      <div id="nicknameField" class="field" style="display:none;">
        <label>닉네임</label>
        <input id="nicknameInput"
               maxlength="12"
               placeholder="최대 12자">
      </div>

      <div class="field">
        <label>이메일</label>
        <input id="emailInput"
               type="email"
               placeholder="example@email.com">
      </div>

      <div class="field">
        <label>비밀번호</label>
        <input id="passwordInput"
               type="password"
               placeholder="비밀번호">
      </div>

      <button id="authButton"
              class="primaryBtn"
              onclick="submitAuth()">
        로그인
      </button>

      <div id="authError" class="authError"></div>

    </div>

  </section>


  <!-- MAIN -->
  <main id="mainApp" class="main" style="display:none;">

    <!-- LEFT -->
    <aside id="sidebar" class="sidebar">

      <div class="sidebarTop">

        <div class="sidebarTitle">
          채팅
        </div>

        <input
          id="roomSearchInput"
          class="roomSearch"
          placeholder="채팅방 검색..."
          oninput="renderRoomList()"
        >

        <div class="roomActions">

          <button onclick="openCreateRoomModal()">
            ＋ 만들기
          </button>

          <button onclick="openJoinRoomModal()">
            🔑 입장
          </button>

        </div>

      </div>

      <div id="roomList" class="roomList"></div>

    </aside>


    <!-- CENTER -->
    <section class="chat">

      <div class="chatHeader">

        <div class="chatHeaderLeft">

          <button
            class="mobileMenuBtn"
            onclick="toggleMobileSidebar()">
            ☰
          </button>

          <div>
            <div id="chatTitle" class="chatTitle">
              🌎 전체톡
            </div>

            <div id="chatSub" class="chatSub">
              FormWheel 전체 채팅
            </div>
          </div>

        </div>

        <div class="chatHeaderActions">

          <button
            class="smallBtn"
            onclick="showCurrentRoomInfo()">
            ⓘ
          </button>

        </div>

      </div>


      <div id="messages" class="messages"></div>

      <div id="typing" class="typing"></div>

      <div style="position:relative;">

        <div id="emojiPanel" class="emojiPanel">

          <div class="emojiGrid">

            <button class="emoji" onclick="insertEmoji('😀')">😀</button>
            <button class="emoji" onclick="insertEmoji('😂')">😂</button>
            <button class="emoji" onclick="insertEmoji('🤣')">🤣</button>
            <button class="emoji" onclick="insertEmoji('😊')">😊</button>
            <button class="emoji" onclick="insertEmoji('😍')">😍</button>
            <button class="emoji" onclick="insertEmoji('😎')">😎</button>
            <button class="emoji" onclick="insertEmoji('🥳')">🥳</button>
            <button class="emoji" onclick="insertEmoji('🤔')">🤔</button>

            <button class="emoji" onclick="insertEmoji('👍')">👍</button>
            <button class="emoji" onclick="insertEmoji('👎')">👎</button>
            <button class="emoji" onclick="insertEmoji('👏')">👏</button>
            <button class="emoji" onclick="insertEmoji('🔥')">🔥</button>
            <button class="emoji" onclick="insertEmoji('❤️')">❤️</button>
            <button class="emoji" onclick="insertEmoji('💯')">💯</button>
            <button class="emoji" onclick="insertEmoji('🎉')">🎉</button>
            <button class="emoji" onclick="insertEmoji('✨')">✨</button>

            <button class="emoji" onclick="insertEmoji('😢')">😢</button>
            <button class="emoji" onclick="insertEmoji('😭')">😭</button>
            <button class="emoji" onclick="insertEmoji('😡')">😡</button>
            <button class="emoji" onclick="insertEmoji('😱')">😱</button>
            <button class="emoji" onclick="insertEmoji('🤯')">🤯</button>
            <button class="emoji" onclick="insertEmoji('💀')">💀</button>
            <button class="emoji" onclick="insertEmoji('👀')">👀</button>
            <button class="emoji" onclick="insertEmoji('🙌')">🙌</button>

          </div>

        </div>


        <div class="composer">

          <button
            class="iconBtn"
            onclick="toggleEmoji()">
            😊
          </button>

          <textarea
            id="messageInput"
            class="composerInput"
            maxlength="2000"
            placeholder="메시지를 입력하세요..."
            onkeydown="handleMessageKey(event)"
            oninput="handleTyping()"></textarea>

          <button
            class="sendBtn"
            onclick="sendMessage()">
            ➤
          </button>

        </div>

      </div>

    </section>


    <!-- RIGHT -->
    <aside class="rightbar">

      <div class="rightSection">

        <div class="rightTitle">
          👥 온라인 사용자
        </div>

        <input
          id="userSearchInput"
          class="userSearch"
          placeholder="사용자 검색..."
          oninput="renderUsers()">

        <div id="onlineList" class="onlineList"></div>

      </div>


      <!-- PRODUCER -->
      <div id="producerPanel"
           class="rightSection producerPanel">

        <div class="rightTitle">
          🛡️ Producer
        </div>

        <button
          class="smallBtn"
          onclick="openCommandModal()"
          style="width:100%;margin-bottom:8px;">
          ＋ 명령어 만들기
        </button>

        <div id="commandList"></div>

      </div>

    </aside>

  </main>


  <div id="mobileOverlay"
       class="mobileOverlay"
       onclick="closeMobileSidebar()"></div>

</div>


<!-- CREATE ROOM -->
<div id="createRoomModal" class="modal">

  <div class="modalCard">

    <button class="closeBtn"
            onclick="closeModal('createRoomModal')">
      ×
    </button>

    <div class="modalTitle">
      🏠 채팅방 만들기
    </div>

    <div class="field">
      <label>채팅방 이름</label>
      <input id="createRoomName"
             maxlength="30"
             placeholder="예: 게임 이야기">
    </div>

    <div class="modalActions">
      <button onclick="closeModal('createRoomModal')">
        취소
      </button>

      <button class="confirm"
              onclick="createRoom()">
        만들기
      </button>
    </div>

  </div>

</div>


<!-- JOIN ROOM -->
<div id="joinRoomModal" class="modal">

  <div class="modalCard">

    <button class="closeBtn"
            onclick="closeModal('joinRoomModal')">
      ×
    </button>

    <div class="modalTitle">
      🔑 채팅방 입장
    </div>

    <div class="field">
      <label>방 코드</label>

      <input
        id="joinRoomCode"
        maxlength="6"
        placeholder="6자리 코드"
        oninput="this.value=this.value.toUpperCase()">
    </div>

    <div id="joinError"
         style="color:#e53935;font-size:12px;"></div>

    <div class="modalActions">

      <button onclick="closeModal('joinRoomModal')">
        취소
      </button>

      <button class="confirm"
              onclick="joinRoomByCode()">
        입장
      </button>

    </div>

  </div>

</div>


<!-- EDIT -->
<div id="editModal" class="modal">

  <div class="modalCard">

    <button class="closeBtn"
            onclick="closeModal('editModal')">
      ×
    </button>

    <div class="modalTitle">
      ✏️ 메시지 수정
    </div>

    <textarea
      id="editInput"
      style="width:100%;min-height:110px;border:1px solid #ddd;border-radius:10px;padding:10px;resize:vertical;"></textarea>

    <div class="modalActions">

      <button onclick="closeModal('editModal')">
        취소
      </button>

      <button class="confirm"
              onclick="saveEditedMessage()">
        저장
      </button>

    </div>

  </div>

</div>


<!-- USER / BAN -->
<div id="banModal" class="modal">

  <div class="modalCard">

    <button class="closeBtn"
            onclick="closeModal('banModal')">
      ×
    </button>

    <div class="modalTitle">
      🚫 사용자 Ban
    </div>

    <div id="banTargetText"
         style="font-size:14px;margin-bottom:15px;"></div>

    <div class="field">
      <label>Ban 시간</label>

      <select id="banMinutes"
              style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;">

        <option value="5">5분</option>
        <option value="10">10분</option>
        <option value="30">30분</option>
        <option value="60">1시간</option>

      </select>

    </div>

    <div class="modalActions">

      <button onclick="closeModal('banModal')">
        취소
      </button>

      <button class="confirm"
              onclick="banUser()">
        Ban
      </button>

    </div>

  </div>

</div>


<!-- COMMAND -->
<div id="commandModal" class="modal">

  <div class="modalCard">

    <button class="closeBtn"
            onclick="closeModal('commandModal')">
      ×
    </button>

    <div class="modalTitle">
      🤖 명령어 만들기
    </div>

    <div class="field">
      <label>명령어</label>
      <input
        id="commandName"
        placeholder="@봇소환">
    </div>

    <div class="field">
      <label>내용</label>
      <textarea
        id="commandText"
        style="width:100%;min-height:80px;border:1px solid #ddd;border-radius:9px;padding:10px;"></textarea>
    </div>

    <div class="field">
      <label>동작</label>

      <select
        id="commandAction"
        style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;">

        <option value="message">메시지</option>
        <option value="bot">봇</option>
        <option value="search">사용자 검색</option>

      </select>

    </div>

    <div class="modalActions">

      <button onclick="closeModal('commandModal')">
        취소
      </button>

      <button class="confirm"
              onclick="saveCommand()">
        저장
      </button>

    </div>

  </div>

</div>


<script type="module" src="./assets/app.js"></script>

</body>
</html>
